name: Check and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run checks (publishing stops here if anything fails)
        run: node tests/run.mjs

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (live at /, test version at /beta/)
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          if [ -f beta/index.html ]; then mkdir -p _site/beta && cp -r beta/index.html beta/css beta/js _site/beta/; fi
          touch _site/.nojekyll
      - name: Stamp file links with this version so browsers never mix old and new files
        run: |
          V=${GITHUB_SHA::8}
          find _site -name '*.js' -exec sed -i -E "s#(from[[:space:]]+['\"]\./[^'\"?]+\.js)(['\"])#\1?v=$V\2#g" {} +
          find _site -name 'index.html' -exec sed -i -E "s#(src|href)=\"((js|css)/[^\"?]+)\"#\1=\"\2?v=$V\"#g" {} +
          grep -rho "?v=$V" _site | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
